<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-grid">
        <header class="app-header">
            <h1 class="city-name">Some City</h1>
            <span class="date-time">date-time</span>
        </header>
        <div class="app-search">
            <input type="search" class="search-bar" placeholder="Search a location">
            <button type="submit" class="search-button"><img class="search-icon" src="icons/search.png" alt="Search Weather"></button>
        </div>
        <section class="app-weather">
            <p class="temp-text">23°</p>
            <div class="unit-btn-wrapper">
                <button class="unit-btn" id="celsious-btn">C</button>
                <button class="unit-btn" id="faren-btn">F</button>
            </div>
        </section>
        <section class="app-stats">
            <div class="stat-left">
                <img src="icons/clouds.png" alt="Weather Visualization" class="weather-icon">
            </div>
            <div class="stat-right">
                <div class="wind-row">
                    <div class="wind">
                    </div>
                    <p class="wind-spd stat-val">17</p>
                </div>
                <div class="humidity-row">
                    <div class="humidity"></div>
                    <p class="hum-value stat-val">20%</p>
                </div>
                <div class="aqi-row">
                    <div class="aqi"></div>
                    <p class="aqi-value stat-val">8</p>
                </div>
            </div>
        </section>
        <footer class="app-footer">
            <ul class="app-days">
                <li class="day mon">
                    Mon
                    <div class="day-weather cloudy"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day tue">Tue
                    <div class="day-weather sunny"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day wed">Wed
                    <div class="day-weather rainy"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day thu">Thu
                    <div class="day-weather heavy-rain"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day fri">Fri
                    <div class="day-weather storm"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day sat">Sat
                    <div class="day-weather snowy"></div>
                    <div class="day-temp">24°</div>
                </li>
                <li class="day sun">Sun
                    <div class="day-weather partly-cloudy"></div>
                    <div class="day-temp">24°</div>
                </li>
            </ul>
        </footer>
    </main>
</body>
</html>
