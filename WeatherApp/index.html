<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-grid">
        <header class="app-header">
            <h1 class="city-name" aria-live="polite" data-city>Some City</h1>
            <span class="date-time" aria-live="polite" data-datetime>date-time</span>
        </header>
        <form id="searchField" class="app-search">
            <label for="city-search" class="visually-hidden">Search city</label>
            <input type="search" id="city-search" class="search-bar" placeholder="Enter city" aria-label="Search city weather">
            <button type="submit" class="search-button"><img class="search-icon" src="icons/search.png" alt="Search Weather"></button>
        </form>
        <article class="app-weather">
            <p class="temp-text" aria-live="polite" data-temp>23°</p>
            <div class="unit-btn-wrapper">
                <button type="button" class="unit-btn" id="celsius-btn">C</button>
                <button type="button" class="unit-btn" id="fahrenheit-btn">F</button>
            </div>
            <span class="feels-like">Feels like: 
                <p class="temp-feel" id="temp-feel" data-temp-feel>Na</p>
            </span>
        </article>
        <section class="app-stats">
            <div class="stat-left">
                <img src="" alt="Weather Icon" class="weather-icon" data-weatherIcon>
            </div>
            <div class="stat-right">
                <div class="wind-row">
                    <div class="wind"></div>
                    <p class="wind-spd stat-val" data-wind>Na</p>
                </div>
                <div class="humidity-row">
                    <div class="humidity"></div>
                    <p class="hum-value stat-val" data-humidity>Na</p>
                </div>
               <div class="aqi-row">
                    <div class="aqi"></div>
                    <p class="aqi-value stat-val" data-aqi>Na</p>
                </div>
            </div>
        </section>
        <footer class="app-footer">
            <ul class="forecast-list">
                <li class="forecast-day day1">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
                <li class="forecast-day day2">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
                <li class="forecast-day day3">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
                <li class="forecast-day day4">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
                <li class="forecast-day day5">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
                <li class="forecast-day day6">
                    <span></span>
                    <img class="forecast-weather-icon" src="" alt="">
                    <span class="forecast-temp"></span>
                </li>
            </ul>
        </footer>
    </main>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
